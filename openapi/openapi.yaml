openapi: 3.0.3
info:
  title: MeetReserve API
  version: 1.0.0
  description: >-
    API для создания, подтверждения и отмены брони переговорной комнаты.
    Все временные метки в ответах возвращаются в UTC в формате ISO 8601.
servers:
  - url: http://localhost:8080
    description: Локальный сервер

tags:
  - name: Bookings
    description: Создание и управление бронированиями
  - name: Rooms
    description: Управление переговорными комнатами

paths:
  /api/v1/bookings:
    post:
      tags: [Bookings]
      operationId: createPendingBooking
      summary: Создать временную бронь
      description: Создаёт бронь со статусом PENDING на 10 минут до подтверждения.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Бронь создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          description: Некорректные данные запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Комната не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Комната неактивна или интервал занят
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/bookings/{id}/confirm:
    post:
      tags: [Bookings]
      operationId: confirmBooking
      summary: Подтвердить временную бронь
      description: >-
        Подтверждает PENDING только до expiresAt и устанавливает expiresAt в null.
        Повторное подтверждение CONFIRMED возвращает текущую бронь с 200 OK.
        Подтверждение CANCELLED возвращает 409 BOOKING_NOT_PENDING.
        При now >= expiresAt бронь PENDING переводится в EXPIRED;
        изменение фиксируется до возврата 410 BOOKING_EXPIRED.
        Для уже истёкшей брони также возвращается 410 BOOKING_EXPIRED.
        Тело запроса отсутствует.
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Бронь подтверждена или уже была подтверждена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
              example:
                id: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11
                roomId: 1
                userId: 42
                title: Архитектурный комитет
                startTime: '2026-11-01T14:00:00Z'
                endTime: '2026-11-01T15:00:00Z'
                status: CONFIRMED
                expiresAt: null
                createdAt: '2026-11-01T13:00:00Z'
        '400':
          $ref: '#/components/responses/InvalidBookingId'
        '404':
          $ref: '#/components/responses/BookingNotFound'
        '409':
          $ref: '#/components/responses/BookingNotPending'
        '410':
          $ref: '#/components/responses/BookingExpired'

  /api/v1/bookings/{id}:
    delete:
      tags: [Bookings]
      operationId: cancelBooking
      summary: Отменить бронь
      description: >-
        Переводит действующую PENDING или CONFIRMED в CANCELLED
        и устанавливает expiresAt в null. Запись сохраняется в базе.
        После фиксации отмены интервал становится доступен для новой брони.
        Повторная отмена CANCELLED возвращает 204 No Content.
        При now >= expiresAt бронь PENDING переводится в EXPIRED;
        изменение фиксируется до возврата 410 BOOKING_EXPIRED.
        Для уже истёкшей брони также возвращается 410 BOOKING_EXPIRED.
        Тело запроса отсутствует.
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '204':
          description: Бронь отменена или уже была отменена. Тело ответа отсутствует.
        '400':
          $ref: '#/components/responses/InvalidBookingId'
        '404':
          $ref: '#/components/responses/BookingNotFound'
        '410':
          $ref: '#/components/responses/BookingExpired'

  /api/v1/rooms:
    post:
      tags: [Rooms]
      operationId: createRoom
      summary: Создать переговорную комнату
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
      responses:
        '201':
          description: Комната создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400':
          description: Некорректные данные комнаты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Комната с таким именем уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [Rooms]
      operationId: getRooms
      summary: Получить список комнат
      parameters:
        - name: activeOnly
          in: query
          required: false
          description: Вернуть только активные комнаты
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Список комнат
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomResponse'

  /api/v1/rooms/{id}:
    get:
      tags: [Rooms]
      operationId: getRoom
      summary: Получить комнату
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: Комната найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400':
          $ref: '#/components/responses/InvalidRoomId'
        '404':
          $ref: '#/components/responses/RoomNotFound'

  /api/v1/rooms/{id}/deactivate:
    post:
      tags: [Rooms]
      operationId: deactivateRoom
      summary: Деактивировать комнату
      description: >-
        Деактивирует комнату без удаления исторических бронирований.
        Новые бронирования для неактивной комнаты запрещены.
        Повторная деактивация возвращает текущее состояние комнаты.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: Комната деактивирована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400':
          $ref: '#/components/responses/InvalidRoomId'
        '404':
          $ref: '#/components/responses/RoomNotFound'

components:
  parameters:
    BookingId:
      name: id
      in: path
      required: true
      description: Идентификатор брони. Некорректный UUID возвращает 400 VALIDATION_ERROR.
      schema:
        type: string
        format: uuid
      example: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11

    RoomId:
      name: id
      in: path
      required: true
      description: Идентификатор комнаты
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1

  responses:
    InvalidBookingId:
      description: Некорректный UUID в пути (VALIDATION_ERROR)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: VALIDATION_ERROR
            message: Некорректный UUID брони
            timestamp: '2026-11-01T13:05:00Z'
    BookingNotFound:
      description: Бронь не найдена (BOOKING_NOT_FOUND)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: BOOKING_NOT_FOUND
            message: Бронь не найдена
            timestamp: '2026-11-01T13:05:00Z'
    BookingNotPending:
      description: Нельзя подтвердить отменённую бронь (BOOKING_NOT_PENDING)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: BOOKING_NOT_PENDING
            message: Нельзя подтвердить отменённую бронь
            timestamp: '2026-11-01T13:05:00Z'
    BookingExpired:
      description: Срок временной брони истёк (BOOKING_EXPIRED)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: BOOKING_EXPIRED
            message: Срок временной брони истёк
            timestamp: '2026-11-01T13:10:00Z'

    InvalidRoomId:
      description: Некорректный идентификатор комнаты
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: VALIDATION_ERROR
            message: Некорректный идентификатор комнаты
            timestamp: '2026-11-03T10:00:00Z'

    RoomNotFound:
      description: Комната не найдена
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: ROOM_NOT_FOUND
            message: Комната не найдена
            timestamp: '2026-11-03T10:00:00Z'

  schemas:
    CreateBookingRequest:
      type: object
      required: [roomId, userId, title, startTime, endTime]
      properties:
        roomId:
          type: integer
          format: int64
          minimum: 1
          example: 1
        userId:
          type: integer
          format: int64
          minimum: 1
          example: 42
        title:
          type: string
          minLength: 1
          maxLength: 255
          example: Архитектурный комитет
        startTime:
          type: string
          format: date-time
          description: Время начала бронирования в будущем, с часовым поясом.
          example: '2026-11-01T14:00:00Z'
        endTime:
          type: string
          format: date-time
          example: '2026-11-01T15:00:00Z'
    BookingResponse:
      type: object
      description: Бронь переговорной комнаты. Временные метки возвращаются в UTC (ISO 8601).
      required: [id, roomId, userId, title, startTime, endTime, status, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        roomId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        title:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          type: string
          enum: [PENDING, CONFIRMED, CANCELLED, EXPIRED]
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Срок временного удержания: для PENDING равен createdAt + 10 минут.
            При now >= expiresAt бронь истекает. Для CONFIRMED и CANCELLED
            значение null; для EXPIRED сохраняется исходный срок.
        createdAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [code, message, timestamp]
      properties:
        code:
          type: string
          example: SLOT_ALREADY_BOOKED
        message:
          type: string
        timestamp:
          type: string
          format: date-time
          description: Время ошибки в UTC в формате ISO 8601.

    CreateRoomRequest:
      type: object
      required:
        - name
        - capacity
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Большая переговорная
        capacity:
          type: integer
          format: int32
          minimum: 1
          example: 12
        hasProjector:
          type: boolean
          default: false
          example: true

    RoomResponse:
      type: object
      required:
        - id
        - name
        - capacity
        - hasProjector
        - active
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Большая переговорная
        capacity:
          type: integer
          format: int32
          example: 12
        hasProjector:
          type: boolean
          example: true
        active:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: '2026-11-03T10:00:00Z'
